; Atom Echo S3R R6 candidate: fixed M5Unified 0.2.28 + M5GFX 0.2.35
; FIX3: delay USB BEGIN until FFat MSC backend is ready (Arduino 2.0.17 app_main starts USB before setup with CDC_ON_BOOT=1).
; Manual USB CDC begin retains the user's serial COM port in normal mode.
; 8MB FFat/USBMSC partition, audio I2S and the other device environments remain preserved.
[env:m5stack-atoms3]
platform = espressif32 @ 6.13.0
board = m5stack-atoms3
framework = arduino
lib_deps =
    https://github.com/M5Stack/M5Unified.git#368ad60807161625aa65baad37a4a3af2a7eccea
    https://github.com/M5Stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -D IS_ATOMS3
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -Wdouble-promotion
    -D BOARD_HAS_PSRAM
    -O3
    -funroll-loops
    -fno-exceptions
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_atoms3.csv
board_build.filesystem = ffat

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.14
    m5stack/M5Cardputer@^1.1.1
build_flags =
    -D IS_CARDPUTER=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.embed_txtfiles =
    src/albums.bin
    src/tracks.bin
    src/strings.bin
    src/companies.bin
    src/composers.bin
    src/systems.bin

; CoreS3 + Module Audio experimental: pinned M5Unified 0.2.28 + M5GFX 0.2.35
; Existing I2S ES8388 module path is retained. No hardware/flash on CI.
[env:m5stack-cores3]
platform = espressif32 @ 6.13.0
board = m5stack-cores3
framework = arduino
lib_deps =
    https://github.com/M5Stack/M5Unified.git#368ad60807161625aa65baad37a4a3af2a7eccea
    https://github.com/M5Stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75
build_flags =
    -D IS_CORES3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wdouble-promotion
    -D BOARD_HAS_PSRAM
    -D YM2203_DIAG_SOLO_FNUM=1
    -O3
    -funroll-loops
    -fno-exceptions
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
board_build.filesystem = fatfs
board_build.embed_files =
    logo.png
    play.png
    stop.png
    up.png
    down.png
    auto.png
    back.png
    forward.png
