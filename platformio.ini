[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.14
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -D IS_ATOMS3
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wdouble-promotion
    -D BOARD_HAS_PSRAM
    -O3
    -funroll-loops
    -fno-exceptions
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_atoms3.csv
board_build.filesystem = ffat

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.14
    m5stack/M5Cardputer@^1.1.1
build_flags =
    -D IS_CARDPUTER=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.embed_txtfiles =
    src/albums.bin
    src/tracks.bin
    src/strings.bin
    src/companies.bin
    src/composers.bin
    src/systems.bin

; CoreS3 production: pinned M5Unified 0.2.28 + M5GFX 0.2.35
; CoreS3 ES8388 and built-in speaker share the production audio engine.
[env:m5stack-cores3]
platform = espressif32 @ 6.13.0
board = m5stack-cores3
framework = arduino
; Use the shared R67 engines through vgmM5lib on CoreS3.
; Exclude legacy root C units so no duplicate/global ABI conflicts.
build_src_filter =
    +<*>
    -<fm_engine.c>
    -<pcm_engine.c>
    -<psg_engine.c>
    -<ssg_engine.c>
    -<scc_engine.c>
lib_deps =
    https://github.com/M5Stack/M5Unified.git#368ad60807161625aa65baad37a4a3af2a7eccea
    https://github.com/M5Stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75
build_flags =
    -D IS_CORES3=1
    -D VGMM5_CORES3_R7_QUIETPCM=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wdouble-promotion
    -D BOARD_HAS_PSRAM
    -O3
    -funroll-loops
    -fno-exceptions
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
board_build.filesystem = fatfs
board_build.embed_files =
    logo.png
    play.png
    stop.png
    up.png
    down.png
    auto.png
    back.png
    forward.png
