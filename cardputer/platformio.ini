; Cardputer R6: experimental M5Unified0.2.28 + M5GFX0.2.35 only.
; Production R5 and separate R6 synthesis-only candidate remain pinned to M5Unified 0.2.14.
[env:m5stack-cardputer]
platform = espressif32 @ 6.13.0
board = m5stack-stamps3
framework = arduino
lib_deps =
    https://github.com/M5Stack/M5Unified.git#368ad60807161625aa65baad37a4a3af2a7eccea
    https://github.com/M5Stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75
    m5stack/M5Cardputer@^1.1.1
build_flags =
    -D IS_CARDPUTER=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.embed_txtfiles =
    src/albums.bin
    src/tracks.bin
    src/strings.bin
    src/companies.bin
    src/composers.bin
    src/systems.bin
