; Cardputer R7: one shared vgmM5lib sound core with CoreS3 R67.
; Original R6 is retained in stable/cardputer-r6-unified028-20261026.
[env:m5stack-cardputer]
platform = espressif32 @ 6.13.0
board = m5stack-stamps3
framework = arduino
; Do not build old Cardputer FM/PCM/PSG/SSG/SCC objects a second time.
build_src_filter =
    +<*>
    -<fm_engine.c>
    -<pcm_engine.c>
    -<psg_engine.c>
    -<ssg_engine.c>
    -<scc_engine.c>
lib_deps =
    https://github.com/M5Stack/M5Unified.git#368ad60807161625aa65baad37a4a3af2a7eccea
    https://github.com/M5Stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75
    m5stack/M5Cardputer@^1.1.1
    symlink://../lib/vgmM5lib
build_flags =
    -D IS_CARDPUTER=1
    -D VGMM5_CARDPUTER_VGMM5LIB=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.embed_txtfiles =
    src/albums.bin
    src/tracks.bin
    src/strings.bin
    src/companies.bin
    src/composers.bin
    src/systems.bin

; Optional comparison candidate: restore the original R6-like +18dB
; C140 scale only. FM synthesis remains shared with CoreS3 R67.
; This is not the default Cardputer R7 firmware.
[env:m5stack-cardputer-classic]
extends = env:m5stack-cardputer
build_flags =
    ${env:m5stack-cardputer.build_flags}
    -D VGMM5_CARDPUTER_C140_GAIN_Q8=2048
