; EXPERIMENTAL LIBRARY UPDATE — stable R61 YM2151 source is unchanged.
; M5Unified 0.2.28 + M5GFX 0.2.35. Do not merge without hardware/noise verification.
; R61: R58 exact Speaker timing + R59 YM2151 UB guard + R60 panel compatibility overlay
; Change is limited to PCM integer arithmetic; R57 base must pass QA before physical use.
[env:tab5-r61-speaker-revert]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
monitor_speed = 115200
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -std=gnu++17
    -D TAB5_WITH_REAL_AUDIO
    -D VGMM5_TAB5_FORCE_NEUTRAL_EQ=1
    -D VGMM5_R47_YM2151_FIR25_NATIVE=1
    -D VGMM5_R49_SEGMENT_SWITCH=1
    -D VGMM5_R53_STEADY_FULL_AUDIO=1
lib_deps =
    https://github.com/M5Stack/M5Unified.git#368ad60807161625aa65baad37a4a3af2a7eccea
    https://github.com/M5Stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75

; REAL 16MiB Tab5 layout. Tail protected; APP-ONLY guarded deployment only.
board_build.partitions = tab5_live_humanxdf_preserve_16MB.csv
