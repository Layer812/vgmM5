name: CoreS3 PR60 complete partial I2S DMA writes (NO FLASH)
on:
  push:
    branches: [dev/cores3-r67-pr60-i2s-partial-write-ownership-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores3:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard exact reviewed PR60 I2S ownership source and unchanged PR56 codec/PCM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='origin/dev/cores3-r67-pr56-es8388-volume-repair-20261105'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={'src/vgm_engine.cpp','cores3/r67_pr60_i2s_partial_write.hpp',
                   'cores3/tests/r67_pr60_i2s_partial_write_host.cpp',
                   '.github/workflows/cores3-r67-pr60-i2s-partial-write-native.yml'}
          assert changed==allowed,(changed-allowed,allowed-changed)
          actual=subprocess.check_output(['git','hash-object','src/vgm_engine.cpp'],text=True).strip()
          assert actual=='1c2d1dd70d1818be5ab114f0cfbbaeb61505b2d7',actual
          # Fixed Git blob ID requires exact, byte-for-byte vetted I2S ownership
          # changes, not merely passing a grep or code-shape check.
          for path in ('src/voice.cpp','cores3/r67_ui_controls.hpp',
                       'cores3/r67_fix6_mixer_safety.hpp','platformio.ini',
                       'lib/vgmM5lib/src/pcm_engine.c',
                       'lib/vgmM5lib/src/fm_engine.c',
                       'tab5/firmware/src/pcm_engine.c'):
              before=subprocess.check_output(['git','show',base+':'+path])
              assert Path(path).read_bytes()==before,path
          now=Path('src/vgm_engine.cpp').read_text()
          assert 'pending_i2s.advance(requested,' in now
          assert 'if (queued) pending_i2s.reset();' in now
          assert 'if (!any_playing || prebuffering) pending_i2s.reset();' in now
          assert 'g_cores3_es8388_addr = addr;' in now
          assert 'cores3_r67_es8388_volume_register(vol)' in now
          print('PASS byte-exact reviewed CoreS3 PR60 source and PR56 volume/I2S/PCM/Tab5 preservation')
          PY
      - name: I2S DMA short-write exact byte-stream and ring-slot ownership regression
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
             cores3/tests/r67_pr60_i2s_partial_write_host.cpp -o /tmp/pr60_refill
          /tmp/pr60_refill
      - name: PR56 ES8388 volume/touch regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
            cores3/tests/r67_pr56_es8388_volume_host.cpp -o /tmp/pr56_volume
          /tmp/pr56_volume
      - name: Existing C140 22-voice PCM parity and C352 regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/vgm_shims
          printf '#pragma once\n#define IRAM_ATTR\n#define DRAM_ATTR\n' >/tmp/vgm_shims/esp_attr.h
          printf '#pragma once\n' >/tmp/vgm_shims/esp_partition.h
          printf '#pragma once\n' >/tmp/vgm_shims/esp_heap_caps.h
          for name in r67_pr47_c140_boundary_host r67_pr47_c140_c352_parity_host; do
            gcc -std=gnu11 -O3 -DIS_CORES3=1 -I/tmp/vgm_shims -Ilib/vgmM5lib/src \
              cores3/tests/${name}.c lib/vgmM5lib/src/pcm_engine.c -lm -o /tmp/${name}
            /tmp/${name}
          done
      - name: VGM 44.1kHz 100-second timing parity
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
            cores3/tests/r67_c140_vgm_44100_timing_host.cpp -o /tmp/vgm_timing
          /tmp/vgm_timing
      - name: Install pinned CoreS3 PlatformIO + M5Unified/M5GFX
        run: |
          pip install --disable-pip-version-check platformio 'click==8.1.8'
          pio pkg install -e m5stack-cores3
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          r=Path('.pio/libdeps/m5stack-cores3')
          assert 'version=0.2.28' in (r/'M5Unified/library.properties').read_text()
          target=r/'M5GFX'
          if not target.exists() or 'version=0.2.35' not in (target/'library.properties').read_text():
              cand=[p.parent for p in r.glob('M5GFX@*/library.properties') if 'version=0.2.35' in p.read_text()]
              assert len(cand)==1,cand
              if target.exists(): shutil.rmtree(target)
              shutil.copytree(cand[0],target)
          assert 'version=0.2.35' in (target/'library.properties').read_text()
          PY
      - name: Real ESP32-S3 native build NO FLASH
        run: pio run -e m5stack-cores3
      - name: Check compiled audio unit and archive APP-ONLY SHA-256 image
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.pio/build/m5stack-cores3')
          units=list(root.rglob('vgm_engine.cpp.o'))
          assert len(units)==1,units
          pcm=list(root.rglob('pcm_engine.c.o'))
          assert len(pcm)==1 and 'vgmM5lib' in str(pcm[0]),pcm
          image=(root/'firmware.bin').read_bytes()
          assert len(image)>100000 and image[0]==0xe9
          out=Path('cores3/r67_pr60_i2s_artifact')
          out.mkdir(parents=True,exist_ok=True)
          (out/'firmware.bin').write_bytes(image)
          record={
              'target':'ESP32-S3 CoreS3','baseline':'PR56 volume repair',
              'optimization':'retain PCM ring slot on I2S short/zero writes; resume remaining byte suffix',
              'pcm_math':'UNCHANGED','c140_rom':'UNCHANGED','i2s_dma_config':'UNCHANGED',
              'volume':'PR56 preserved','native_build':'PASS','hardware_audio':'UNTESTED',
              'flash':'NOT PERFORMED','app_offset':'0x10000',
              'sha256':hashlib.sha256(image).hexdigest(),'size_bytes':len(image)
          }
          (out/'RESULT.json').write_text(json.dumps(record,indent=2)+'\n')
          cmd='''@echo off
          setlocal
          if "%~1"=="" (
              echo Usage: %~nx0 COM9
              exit /b 2
          )
          python -c "import hashlib,json,sys; from pathlib import Path; f=Path(sys.argv[1]); m=json.loads(Path(sys.argv[2]).read_text()); h=hashlib.sha256(f.read_bytes()).hexdigest(); print('SHA256:',h); sys.exit(0 if h==m['sha256'] else 1)" "%~dp0firmware.bin" "%~dp0RESULT.json"
          if errorlevel 1 (
              echo ERROR: firmware SHA256 mismatch; NOTHING FLASHED
              exit /b 1
          )
          python -m esptool --chip esp32s3 -p "%~1" -b 460800 --before default_reset --after hard_reset write_flash 0x10000 "%~dp0firmware.bin"
          if errorlevel 1 exit /b 1
          echo PASS: CoreS3 PR60 app-only flashed.
          '''
          (out/'RUN_THIS_CORES3_PR60_APP_ONLY.cmd').write_text(cmd)
          print('PASS native image SHA256',record['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CORES3-PR60-I2S-PARTIAL-WRITE-APP-ONLY-NOFLASH
          path: cores3/r67_pr60_i2s_artifact/
          retention-days: 14
