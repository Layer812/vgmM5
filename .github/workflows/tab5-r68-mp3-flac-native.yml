name: Tab5 R68 MP3 FLAC standalone compressed PCM (NO FLASH)
on:
  push:
    branches:
      - dev/tab5-r68-mp3-flac-playback-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect Tab5 stable audio drivers, partitions and other boards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root='origin/main'
          for path in (
              'tab5/firmware/tab5_live_humanxdf_preserve_16MB.csv',
              'tab5/firmware/src/fm_engine.c',
              'tab5/firmware/src/mdx_engine.cpp',
              'tab5/firmware/src/pcm_engine.c',
              'tab5/firmware/src/psg_engine.c',
              'tab5/firmware/src/scc_engine.c',
              'tab5/firmware/src/ssg_engine.c',
              'tab5/firmware/src/tab5_audio_contract.cpp',
              'tab5/firmware/platformio.ini',
              'cardputer/src/voice.cpp',
              'src/vgm_engine.cpp'
          ):
              assert Path(path).read_bytes()==subprocess.check_output(['git','show',root+':'+path]),path
          pc=Path('tab5/firmware/src/tab5_pcm_file_engine.cpp').read_text()
          v=Path('tab5/firmware/src/vgm_engine.cpp').read_text()
          b=Path('tab5/firmware/src/tab5_engine_bridge.cpp').read_text()
          ui=Path('tab5/firmware/src/main.cpp').read_text()
          model=Path('tab5/firmware/src/tab5_browser_model.cpp').read_text()
          assert 'drflac_read_pcm_frames_s16' in pc
          assert 'mp3dec_decode_frame' in pc
          assert 'vgm_audio_queue_publish()' in pc
          assert 'pcm_file_engine_is_playing()' in v
          assert 'pcm_file_engine_stop()' in b
          assert 'PlayerState::PlayingPcm' in b and 'PlayerState::PlayingPcm' in ui
          assert 'ext==".mp3" || ext==".flac"' in model
          assert 'erase_flash' not in pc and 'M5.Speaker.begin' not in pc
          assert Path('tab5/firmware/src/vendor/minimp3.h').stat().st_size>70000
          assert Path('tab5/firmware/src/vendor/dr_flac.h').stat().st_size>500000
          print('PASS MP3/FLAC source, unchanged stable audio paths, APP/partition protection')
          PY
      - name: Host test actual Tab5 AY8910 and SCC/SCC+ engines with ASan and UBSan
        run: |
          set -euo pipefail
          mkdir -p /tmp/tab5_r62_shims
          printf '#pragma once\n#define IRAM_ATTR\n' >/tmp/tab5_r62_shims/esp_attr.h
          gcc -std=gnu11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/tab5_r62_shims -Itab5/firmware/src tab5/tests/r62_ay_scc_host.c tab5/firmware/src/ssg_engine.c tab5/firmware/src/scc_engine.c -lm -o /tmp/tab5_r62_fidelity_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/tab5_r62_fidelity_host
      - name: Host-test actual Tab5 PCM engine C352 divider and unchanged C140 with ASan/UBSan
        run: |
          set -euo pipefail
          mkdir -p /tmp/tab5_r63_shims
          printf '#pragma once\n#define IRAM_ATTR\n#define DRAM_ATTR\n' >/tmp/tab5_r63_shims/esp_attr.h
          printf '#pragma once\n' >/tmp/tab5_r63_shims/esp_partition.h
          printf '#pragma once\n' >/tmp/tab5_r63_shims/esp_heap_caps.h
          gcc -std=gnu11 -O1 -g -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/tab5_r63_shims -Itab5/firmware/src tab5/tests/r63_c352_clock_host.c tab5/firmware/src/pcm_engine.c -Wl,--gc-sections -lm -o /tmp/r63_c352_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/r63_c352_host
      - name: Host-test actual Tab5 PCM MSM6258 divider codes with ASan/UBSan
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O1 -g -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/tab5_r63_shims -Itab5/firmware/src tab5/tests/r64_msm6258_clock_host.c tab5/firmware/src/pcm_engine.c -Wl,--gc-sections -lm -o /tmp/r64_msm6258_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/r64_msm6258_host
      - name: Host-test R65 physical vs wrapper mixer counts and natural EOF tail fade (ASan/UBSan)
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer tab5/tests/r65_vgm_mix_tail_host.cpp -o /tmp/r65_vgm_mix_tail_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/r65_vgm_mix_tail_host
      - name: Verify VGM1.71 header modes and generator-specific dispatch
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          # Two headers with identical command streams must select distinct SCC RAM rules.
          def header(clock, c140_type=0):
              b=bytearray(0x100)
              b[:4]=b'Vgm '
              struct.pack_into('<I',b,8,0x171)
              struct.pack_into('<I',b,0x9c,clock)
              b[0x96]=c140_type
              return b
          for flag in (0,0x80000000):
              b=header(1789772|flag)
              c=struct.unpack_from('<I',b,0x9c)[0]
              assert (c & 0x3fffffff)==1789772
              assert bool(c & 0x80000000)==bool(flag)
          for typ in (0,1,2):
              b=header(1789772,typ)
              assert b[0x96]==typ
          s=Path('tab5/firmware/src/vgm_engine.cpp').read_text()
          assert 'scc_engine_set_variant(&g_scc_engine, is_scc_plus);' in s
          assert 'declared_c140_type = (vgmDataStart > 0x96) ? header[0x96] : 0u;' in s
          print('PASS 0x9C K051649/K052539 bit31 and C140 subtype byte 0x96')
          PY
      - name: Host regression R67 1-LSB silent PCM preserves nonzero samples
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer tab5/tests/r67_silence_dither_host.cpp -o /tmp/r67_silence
          ASAN_OPTIONS=detect_leaks=1 /tmp/r67_silence
      - name: Install exact Tab5 ESP32-P4 PlatformIO toolchain
        run: |
          python3 -m pip install --disable-pip-version-check platformio
          python3 -m pip install --disable-pip-version-check 'click==8.1.8'
          cd tab5/firmware && pio pkg install -e tab5-r61-speaker-revert
      - name: Force build-local exact M5GFX 0.2.35 against transitive 0.2.36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('tab5/firmware/.pio/libdeps/tab5-r61-speaker-revert')
          unified=root/'M5Unified'/'library.properties'
          assert unified.exists() and 'version=0.2.28' in unified.read_text()
          pinned=[p.parent for p in root.glob('M5GFX@*/library.properties') if 'version=0.2.35' in p.read_text()]
          assert len(pinned)==1,[(str(p),p.read_text()[:250]) for p in root.glob('M5GFX*/library.properties')]
          preferred=root/'M5GFX'
          if not preferred.exists() or 'version=0.2.35' not in (preferred/'library.properties').read_text():
              # M5Unified's >=0.2.35 transitively installs 0.2.36 as M5GFX
              # in November 2026, ahead of the git-pinned 0.2.35 clone.
              # Replace ONLY the temporary CI registry copy, never repository or device files.
              if preferred.exists(): shutil.rmtree(preferred)
              shutil.copytree(pinned[0],preferred)
              print('R62 repaired CI-only dependency collision: removed transient M5GFX0.2.36, installed pinned0.2.35')
          assert 'version=0.2.35' in (preferred/'library.properties').read_text()
          print('PASS exact M5Unified0.2.28 / M5GFX0.2.35, no dependency regression')
          PY
          python3 tab5/patch_m5gfx_r60.py
      - name: Real Tab5 ESP32-P4 native firmware build (NO FLASH)
        run: cd tab5/firmware && pio run -e tab5-r61-speaker-revert
      - name: Check firmware bounds and archive R68 MP3 FLAC candidate
        run: |
          mkdir -p tab5/r68_artifacts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,shutil,json
          p=Path('tab5/firmware/.pio/build/tab5-r61-speaker-revert/firmware.bin')
          b=p.read_bytes()
          assert 100000<len(b)<0x800000 and b[0]==0xe9,'invalid P4 firmware'
          shutil.copyfile(p,'tab5/r68_artifacts/firmware.bin')
          # Complete ESP-IDF handoff images are shipped alongside the APP.
          # These are built in ONE native PlatformIO run and are NOT flashed in CI.
          build=p.parent
          for name,limit,firstbyte in [('bootloader.bin',0x6000,0xe9),
                                        ('partitions.bin',0x1000,0xaa)]:
              source=build/name
              assert source.is_file(),f'Missing ESP-IDF handoff image: {source}'
              raw=source.read_bytes()
              assert 0<len(raw)<=limit,(name,len(raw),'offset overlap')
              assert raw[0]==firstbyte,(name,'bad image header')
              shutil.copyfile(source,'tab5/r68_artifacts/'+name)
              print('ESP-IDF handoff image:',name,len(raw),hashlib.sha256(raw).hexdigest())
          csv=Path('tab5/firmware/tab5_live_humanxdf_preserve_16MB.csv').read_text()
          assert '0x10000' in csv and '0x810000' in csv
          shutil.copyfile('tab5/firmware/tab5_live_humanxdf_preserve_16MB.csv',
                          'tab5/r68_artifacts/partitions.csv')
          print('Layout: bootloader @0x2000, partition table @0x8000, APP @0x10000')

          report=dict(target='M5Stack Tab5 ESP32-P4',mp3_flac='COMPILED_UNVERIFIED',image_size=len(b),sha256=hashlib.sha256(b).hexdigest(),native_build='PASS',host_ay_scc='PASS',host_c352='PASS',host_msm6258='PASS',host_r65_mix_tail='PASS',host_r67_silent_dither='PASS',R66_A_user_listening='NO_POPS',c140_gain='PLUS_6_DB_CANDIDATE',flash='NOT PERFORMED',physical_audio='PENDING',stable_main_untouched=True)
          Path('tab5/r68_artifacts/RESULT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(report)
          PY
          (cd tab5/r68_artifacts && sha256sum firmware.bin bootloader.bin partitions.bin > SHA256SUMS.txt)
          cp tab5/firmware/.pio/R61_M5GFX_PATCH_SHA256.json tab5/r68_artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vgmM5-Tab5-R68-MP3-FLAC-native-NOFLASH
          path: tab5/r68_artifacts/
          retention-days: 14
