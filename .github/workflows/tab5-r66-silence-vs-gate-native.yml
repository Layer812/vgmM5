name: Tab5 R66 A silent dither vs B note fade (NO FLASH)
on:
  push:
    branches:
      - dev/tab5-r66-silence-vs-gate-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect R61/R65 core and exact Tab5 dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='origin/dev/tab5-r65-output-tail-level-20261103'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={'tab5/firmware/src/psg_engine.c','tab5/firmware/src/psg_engine.h',
             'tab5/firmware/src/ssg_engine.c','tab5/firmware/src/ssg_engine.h',
             'tab5/firmware/src/vgm_engine.cpp','tab5/firmware/src/tab5_r66_note_declick.h',
             'tab5/firmware/src/tab5_r66_silence_dither.hpp',
             'tab5/tests/r66_note_declick_host.c','tab5/tests/r66_silence_dither_host.cpp',
             '.github/workflows/tab5-r66-silence-vs-gate-native.yml'}
          assert changed==allowed,(changed-allowed,allowed-changed)
          for path in ('tab5/firmware/src/fm_engine.c','tab5/firmware/src/pcm_engine.c',
             'tab5/firmware/src/scc_engine.c','tab5/firmware/src/ym2413_core.c',
             'tab5/firmware/src/main.cpp','tab5/firmware/src/tab5_vgm_mix_tail.hpp',
             'tab5/firmware/platformio.ini','tab5/firmware/tab5_live_humanxdf_preserve_16MB.csv',
             'src/vgm_engine.cpp','src/fm_engine.c','cardputer/src/fm_engine.c'):
             old=subprocess.check_output(['git','show',base+':'+path])
             assert Path(path).read_bytes()==old,path
          s=Path('tab5/firmware/src/vgm_engine.cpp').read_text()
          assert 'tab5_r66_fill_silent_pcm(' in s and 'tab5::vgm_fade_final_pcm_block(out_buf, BUFF_SIZE)' in s
          assert 'tab5_r66_note_begin(' in Path('tab5/firmware/src/psg_engine.c').read_text()
          assert 'tab5_r66_note_begin(' in Path('tab5/firmware/src/ssg_engine.c').read_text()
          print('PASS R66 isolated to two A/B experiments, protected R61/R65 and platformio.ini')
          PY
      - name: Host A 1-LSB dither regression (ASan/UBSan)
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer tab5/tests/r66_silence_dither_host.cpp -o /tmp/r66_dither
          ASAN_OPTIONS=detect_leaks=1 /tmp/r66_dither
      - name: Host B actual SN76489 and AY8910 gate regression (ASan/UBSan)
        run: |
          set -euo pipefail
          mkdir -p /tmp/r66_shims
          printf '#pragma once\n#define IRAM_ATTR\n' >/tmp/r66_shims/esp_attr.h
          gcc -std=gnu11 -O1 -g -Wall -Wextra -Werror -DVGMM5_R66_PSG_GATE_RAMP=1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/r66_shims -Itab5/firmware/src tab5/tests/r66_note_declick_host.c tab5/firmware/src/psg_engine.c tab5/firmware/src/ssg_engine.c -lm -o /tmp/r66_gate
          ASAN_OPTIONS=detect_leaks=1 /tmp/r66_gate
      - name: Host test actual Tab5 AY8910 and SCC/SCC+ engines with ASan and UBSan
        run: |
          set -euo pipefail
          mkdir -p /tmp/tab5_r62_shims
          printf '#pragma once\n#define IRAM_ATTR\n' >/tmp/tab5_r62_shims/esp_attr.h
          gcc -std=gnu11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/tab5_r62_shims -Itab5/firmware/src tab5/tests/r62_ay_scc_host.c tab5/firmware/src/ssg_engine.c tab5/firmware/src/scc_engine.c -lm -o /tmp/tab5_r62_fidelity_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/tab5_r62_fidelity_host
      - name: Host-test actual Tab5 PCM engine C352 divider and unchanged C140 with ASan/UBSan
        run: |
          set -euo pipefail
          mkdir -p /tmp/tab5_r63_shims
          printf '#pragma once\n#define IRAM_ATTR\n#define DRAM_ATTR\n' >/tmp/tab5_r63_shims/esp_attr.h
          printf '#pragma once\n' >/tmp/tab5_r63_shims/esp_partition.h
          printf '#pragma once\n' >/tmp/tab5_r63_shims/esp_heap_caps.h
          gcc -std=gnu11 -O1 -g -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/tab5_r63_shims -Itab5/firmware/src tab5/tests/r63_c352_clock_host.c tab5/firmware/src/pcm_engine.c -Wl,--gc-sections -lm -o /tmp/r63_c352_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/r63_c352_host
      - name: Host-test actual Tab5 PCM MSM6258 divider codes with ASan/UBSan
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O1 -g -ffunction-sections -fdata-sections -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I/tmp/tab5_r63_shims -Itab5/firmware/src tab5/tests/r64_msm6258_clock_host.c tab5/firmware/src/pcm_engine.c -Wl,--gc-sections -lm -o /tmp/r64_msm6258_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/r64_msm6258_host
      - name: Host-test R65 physical vs wrapper mixer counts and natural EOF tail fade (ASan/UBSan)
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer tab5/tests/r65_vgm_mix_tail_host.cpp -o /tmp/r65_vgm_mix_tail_host
          ASAN_OPTIONS=detect_leaks=1 /tmp/r65_vgm_mix_tail_host
      - name: Verify VGM1.71 header modes and generator-specific dispatch
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          # Two headers with identical command streams must select distinct SCC RAM rules.
          def header(clock, c140_type=0):
              b=bytearray(0x100)
              b[:4]=b'Vgm '
              struct.pack_into('<I',b,8,0x171)
              struct.pack_into('<I',b,0x9c,clock)
              b[0x96]=c140_type
              return b
          for flag in (0,0x80000000):
              b=header(1789772|flag)
              c=struct.unpack_from('<I',b,0x9c)[0]
              assert (c & 0x3fffffff)==1789772
              assert bool(c & 0x80000000)==bool(flag)
          for typ in (0,1,2):
              b=header(1789772,typ)
              assert b[0x96]==typ
          s=Path('tab5/firmware/src/vgm_engine.cpp').read_text()
          assert 'scc_engine_set_variant(&g_scc_engine, is_scc_plus);' in s
          assert 'declared_c140_type = (vgmDataStart > 0x96) ? header[0x96] : 0u;' in s
          print('PASS 0x9C K051649/K052539 bit31 and C140 subtype byte 0x96')
          PY
      - name: Install exact Tab5 ESP32-P4 PlatformIO toolchain
        run: |
          python3 -m pip install --disable-pip-version-check platformio
          python3 -m pip install --disable-pip-version-check 'click==8.1.8'
          cd tab5/firmware && pio pkg install -e tab5-r61-speaker-revert
      - name: Force build-local exact M5GFX 0.2.35 against transitive 0.2.36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('tab5/firmware/.pio/libdeps/tab5-r61-speaker-revert')
          unified=root/'M5Unified'/'library.properties'
          assert unified.exists() and 'version=0.2.28' in unified.read_text()
          pinned=[p.parent for p in root.glob('M5GFX@*/library.properties') if 'version=0.2.35' in p.read_text()]
          assert len(pinned)==1,[(str(p),p.read_text()[:250]) for p in root.glob('M5GFX*/library.properties')]
          preferred=root/'M5GFX'
          if not preferred.exists() or 'version=0.2.35' not in (preferred/'library.properties').read_text():
              # M5Unified's >=0.2.35 transitively installs 0.2.36 as M5GFX
              # in November 2026, ahead of the git-pinned 0.2.35 clone.
              # Replace ONLY the temporary CI registry copy, never repository or device files.
              if preferred.exists(): shutil.rmtree(preferred)
              shutil.copytree(pinned[0],preferred)
              print('R62 repaired CI-only dependency collision: removed transient M5GFX0.2.36, installed pinned0.2.35')
          assert 'version=0.2.35' in (preferred/'library.properties').read_text()
          print('PASS exact M5Unified0.2.28 / M5GFX0.2.35, no dependency regression')
          PY
          python3 tab5/patch_m5gfx_r60.py
      - name: Native A ESP32-P4 (quiet dither only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tab5/firmware/platformio.ini')
          s=p.read_text()
          anchor='    -D VGMM5_R53_STEADY_FULL_AUDIO=1\n'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,anchor+'    -D VGMM5_R66_SILENCE_DITHER=1\n'))
          PY
          cd tab5/firmware
          pio run -e tab5-r61-speaker-revert
          cd ../..
          mkdir -p tab5/r66_artifacts
          cp tab5/firmware/.pio/build/tab5-r61-speaker-revert/firmware.bin tab5/r66_artifacts/R66_A_SILENCE_DITHER_APP_ONLY.bin
      - name: Native B ESP32-P4 (2ms SN/AY note transition only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tab5/firmware/platformio.ini')
          s=p.read_text()
          old='    -D VGMM5_R66_SILENCE_DITHER=1\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,'    -D VGMM5_R66_PSG_GATE_RAMP=1\n'))
          PY
          cd tab5/firmware
          pio run -e tab5-r61-speaker-revert
          cd ../..
          cp tab5/firmware/.pio/build/tab5-r61-speaker-revert/firmware.bin tab5/r66_artifacts/R66_B_NOTE_RAMP_APP_ONLY.bin
      - name: Validate both app-only BIN and keep build provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('tab5/r66_artifacts')
          rows=[]
          for label,name in [
            ('A: in-song silent 1LSB dither','R66_A_SILENCE_DITHER_APP_ONLY.bin'),
            ('B: 2ms SN/AY note ramp','R66_B_NOTE_RAMP_APP_ONLY.bin')]:
              b=(root/name).read_bytes()
              assert 100000<len(b)<0x800000 and b[0]==0xE9,(name,len(b))
              rows.append(dict(variant=label,file=name,size=len(b),sha256=hashlib.sha256(b).hexdigest()))
          assert rows[0]['sha256']!=rows[1]['sha256'],'A/B images unexpectedly identical'
          report=dict(target='Tab5 ESP32-P4',offset='0x10000',variants=rows,
            existing_R62_R65_host_tests='PASS',host_r66_a='PASS',host_r66_b='PASS',
            M5Unified='0.2.28',M5GFX='0.2.35',NO_FLASH=True,R61_MAIN_UNTOUCHED=True,
            physical_audio='UNTESTED',A_scope='silent frames only while VGM playing',
            B_scope='2ms only on SN/AY register note transitions')
          (root/'RESULT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(report)
          PY
          sha256sum tab5/r66_artifacts/*.bin > tab5/r66_artifacts/SHA256SUMS.txt
          cp tab5/firmware/.pio/R61_M5GFX_PATCH_SHA256.json tab5/r66_artifacts/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vgmM5-Tab5-R66-A-vs-B-DUAL-APP-ONLY-NOFLASH
          path: tab5/r66_artifacts/
          retention-days: 14
