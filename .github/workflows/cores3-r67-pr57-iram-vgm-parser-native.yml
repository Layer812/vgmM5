name: CoreS3 PR57 IRAM VGM command parser (NO FLASH)
on:
  push:
    branches: [dev/cores3-r67-pr57-iram-vgm-parser-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores3:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce exact IRAM-only diff and PR56 volume preservation
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base='origin/dev/cores3-r67-pr56-es8388-volume-repair-20261105'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          expected={'src/vgm_engine.cpp','.github/workflows/cores3-r67-pr57-iram-vgm-parser-native.yml'}
          assert changed==expected,(changed-expected,expected-changed)
          old=subprocess.check_output(['git','show',base+':src/vgm_engine.cpp'],text=True)
          new=Path('src/vgm_engine.cpp').read_text()
          marker='static inline uint8_t readByte() {'
          add='''#if defined(IS_CORES3)
          // PR57: VGM commands are parsed by AudioGenTask. Stage only the parser
          // instructions in internal IRAM; leave all byte/PCM/math/codec semantics intact.
          #define VGM_PARSER_HOT_ATTR IRAM_ATTR
          #else
          #define VGM_PARSER_HOT_ATTR
          #endif

          static inline VGM_PARSER_HOT_ATTR uint8_t readByte() {'''
          assert old.count(marker)==1
          want=old.replace(marker,add)
          assert want.count('void processVGM() {')==1
          want=want.replace('void processVGM() {','VGM_PARSER_HOT_ATTR void processVGM() {')
          assert new==want, 'Any non-IRAM source change or accidental regression is forbidden'
          for protected in ('src/voice.cpp','cores3/r67_ui_controls.hpp',
                            'cores3/tests/r67_pr56_es8388_volume_host.cpp',
                            'lib/vgmM5lib/src/fm_engine.c',
                            'lib/vgmM5lib/src/pcm_engine.c',
                            'platformio.ini','src/vgm_engine.h',
                            'tab5/firmware/src/pcm_engine.c',
                            'tab5/firmware/src/fm_engine.c'):
              current=Path(protected).read_bytes()
              original=subprocess.check_output(['git','show',base+':'+protected])
              assert current==original, protected
          assert 'g_cores3_es8388_addr = addr;' in new
          assert 'cores3_r67_es8388_volume_register(vol)' in new
          assert 'xTaskCreatePinnedToCore(audio_generate_task, "AudioGenTask", 8192, NULL, 5, &playTaskHandle, 1);' in new
          assert 'xTaskCreatePinnedToCore(audio_play_task, "AudioPlayTask", 4096, NULL, 4, NULL, 0);' in new
          print('PASS: exact parser IRAM-only change; ES8388 volume, Tab5, PCM, I2S and CPU affinity byte-identical to PR56')
          PY
      - name: ES8388 volume, tap geometry, mute regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all cores3/tests/r67_pr56_es8388_volume_host.cpp -o /tmp/pr56_volume
          /tmp/pr56_volume
      - name: VGM 44.1 kHz 100-second timing parity
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all cores3/tests/r67_c140_vgm_44100_timing_host.cpp -o /tmp/cores3_timing
          /tmp/cores3_timing
      - name: C140 exact PCM and state parity
        run: |
          set -euo pipefail
          mkdir -p /tmp/vgm_shims
          printf '#pragma once\n#define IRAM_ATTR\n#define DRAM_ATTR\n' >/tmp/vgm_shims/esp_attr.h
          printf '#pragma once\n' >/tmp/vgm_shims/esp_partition.h
          printf '#pragma once\n' >/tmp/vgm_shims/esp_heap_caps.h
          for name in r67_pr47_c140_boundary_host r67_pr47_c140_c352_parity_host; do
            gcc -std=gnu11 -O3 -DIS_CORES3=1 -I/tmp/vgm_shims -Ilib/vgmM5lib/src cores3/tests/${name}.c lib/vgmM5lib/src/pcm_engine.c -lm -o /tmp/${name}
            /tmp/${name}
          done
      - name: Install CoreS3 PlatformIO and pinned libraries
        run: |
          pip install --disable-pip-version-check platformio 'click==8.1.8'
          pio pkg install -e m5stack-cores3
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          r=Path('.pio/libdeps/m5stack-cores3')
          assert 'version=0.2.28' in (r/'M5Unified/library.properties').read_text()
          target=r/'M5GFX'
          if not target.exists() or 'version=0.2.35' not in (target/'library.properties').read_text():
            cand=[p.parent for p in r.glob('M5GFX@*/library.properties') if 'version=0.2.35' in p.read_text()]
            assert len(cand)==1,cand
            if target.exists(): shutil.rmtree(target)
            shutil.copytree(cand[0],target)
          assert 'version=0.2.35' in (target/'library.properties').read_text()
          PY
      - name: ESP32-S3 native build — absolutely NO FLASH
        run: pio run -e m5stack-cores3
      - name: Check actual VGM parser object in internal IRAM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('.pio/build/m5stack-cores3')
          objects=list(root.rglob('vgm_engine.cpp.o'))
          assert len(objects)==1,objects
          objdump=list((Path.home()/'.platformio/packages').glob('*/bin/xtensa-esp32s3-elf-objdump'))
          assert objdump,objdump
          symbols=subprocess.check_output([str(objdump[0]),'-t',str(objects[0])],text=True,errors='replace')
          parser=[s for s in symbols.splitlines() if '_Z10processVGMv' in s]
          assert parser, 'VGM parser symbol not found'
          assert any('.iram1' in s for s in parser),parser
          print('PASS compiled parser .iram1 section:',parser)
          firmware=root/'firmware.bin'
          assert firmware.exists() and firmware.stat().st_size > 100000
          PY
      - name: Produce SHA256-checked APP-ONLY artifact without flashing
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('cores3/r67_pr57_iram_parser_artifact')
          p.mkdir(parents=True,exist_ok=True)
          b=Path('.pio/build/m5stack-cores3/firmware.bin').read_bytes()
          digest=hashlib.sha256(b).hexdigest()
          (p/'firmware.bin').write_bytes(b)
          record=dict(target='CoreS3 ESP32-S3',branch='dev/cores3-r67-pr57-iram-vgm-parser-20261105',
            baseline='dev/cores3-r67-pr56-es8388-volume-repair-20261105',change='IRAM placement of unchanged VGM parser and readByte only',
            native_build='PASS',volume_regression='PASS',c140_24voices='UNCHANGED',
            audio_hardware='UNTESTED',flash='NOT PERFORMED',app_only_offset='0x10000',
            sha256=digest,firmware_bytes=len(b))
          (p/'RESULT.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          cmd='''@echo off
          setlocal
          if "%~1"=="" (
            echo Usage: %~nx0 COM9
            echo This is APP-ONLY at 0x10000. No partition or bootloader operations.
            exit /b 2
          )
          python -c "import hashlib,json,sys; from pathlib import Path; p=Path(sys.argv[1]); manifest=json.loads(Path(sys.argv[2]).read_text()); actual=hashlib.sha256(p.read_bytes()).hexdigest(); print('SHA256:',actual); sys.exit(0 if actual==manifest['sha256'] else 1)" "%~dp0firmware.bin" "%~dp0RESULT.json"
          if errorlevel 1 (
            echo ERROR: firmware SHA256 mismatch; NO FLASH.
            exit /b 1
          )
          python -m esptool --chip esp32s3 -p "%~1" -b 460800 --before default_reset --after hard_reset write_flash 0x10000 "%~dp0firmware.bin"
          if errorlevel 1 exit /b 1
          echo PASS: CoreS3 PR57 app-only flashed.
          '''
          (p/'RUN_THIS_CORES3_PR57_APP_ONLY.cmd').write_text(cmd)
          print('PASS artifact SHA256:',digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CORES3-PR57-IRAM-PARSER-APP-ONLY-NOFLASH
          path: cores3/r67_pr57_iram_parser_artifact/
          retention-days: 14
